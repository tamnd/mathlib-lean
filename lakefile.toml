name = "MathlibHandbook"
version = "0.0.0"
defaultTargets = ["MathlibHandbook"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
git = "https://github.com/leanprover-community/mathlib4"
rev = "master"

[[lean_lib]]
name = "MathlibHandbook"

# SubVerso writes the highlighted Lean of each file as JSON (spec 12.5). The handbook prints the Lean blocks from this JSON.
[[require]]
name = "subverso"
git = "https://github.com/leanprover/subverso"
rev = "main"

# The (L) exercises of the handbook, with sorry (spec 10.4). The default build does not import them. CI builds this library without --wfail, so a statement that no longer elaborates still fails the build.
[[lean_lib]]
name = "Exercises"
roots = ["MathlibHandbook.Exercises"]

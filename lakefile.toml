name = "MathlibHandbook"
version = "0.0.0"
defaultTargets = ["MathlibHandbook"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
git = "https://github.com/leanprover-community/mathlib4"
rev = "master"

[[lean_lib]]
name = "MathlibHandbook"

# SubVerso writes the highlighted Lean of each file as JSON (spec 12.5). The handbook prints the Lean blocks from this JSON.
[[require]]
name = "subverso"
git = "https://github.com/leanprover/subverso"
rev = "main"

name: build

# Build the package on top of the Mathlib cache. The build checks every example and solution against the Mathlib commit of lake-manifest.json. The job then checks that no declaration of the package uses sorry or a nonstandard axiom.
# The job also writes the highlighted Lean of each file (SubVerso JSON, spec 12.5). On a push to main, the job publish puts the tarball highlighted-<commit>.tar.gz on the release highlighted, where mlhb gets it.
on:
  push:
    branches: [main, "edition/**"]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: lake build and the axioms
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          rm elan-init.sh
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: get the Mathlib cache
        run: lake exe cache get
      - name: build
        run: lake build --wfail
      - name: check the axioms
        run: lake env lean --run scripts/Axioms.lean MathlibHandbook
      - name: the highlighted Lean
        id: hl
        run: echo "file=$(./scripts/highlight.sh | tail -1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: highlighted
          path: ${{ steps.hl.outputs.file }}
          if-no-files-found: error

  publish:
    name: publish the highlighted Lean
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: highlighted
          path: out
      - name: upload to the release highlighted
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view highlighted -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create highlighted -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "highlighted Lean" --notes "The SubVerso JSON of each file of the package, one tarball for each commit of main. mlhb of tamnd/mathlib-handbook reads it (spec 12.5)."
          fi
          gh release upload highlighted out/*.tar.gz --clobber -R "$GITHUB_REPOSITORY"
